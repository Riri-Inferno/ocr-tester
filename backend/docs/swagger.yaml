definitions:
  domain.OCRResult:
    properties:
      createdAt:
        description: レコード作成日時
        type: string
      extractedText:
        description: OCR により抽出されたテキスト
        type: string
      fileName:
        description: 処理対象のファイル名
        type: string
      id:
        description: Firestore のドキュメント ID
        type: string
    type: object
  domain.Prompt:
    properties:
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      promptContent:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  domain.PromptInfo:
    properties:
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/hello:
    get:
      description: サーバーの起動確認用エンドポイント
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Hello World メッセージを返す
      tags:
      - General
  /api/ocr-result/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific OCR result stored in Firestore by document
        ID.
      parameters:
      - description: OCR document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.OCRResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get OCR result by ID
      tags:
      - OCR
  /api/prompts:
    get:
      description: Retrieve all prompts (excluding deleted)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.PromptInfo'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all prompts
      tags:
      - Prompts
  /api/prompts/{id}:
    delete:
      description: Delete a prompt by ID (soft delete)
      parameters:
      - description: Prompt ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete prompt
      tags:
      - Prompts
    get:
      description: Retrieve a specific prompt by ID
      parameters:
      - description: Prompt ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Prompt'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get prompt by ID
      tags:
      - Prompts
  /api/prompts/upsert:
    post:
      consumes:
      - application/json
      description: Create a new prompt or update existing one
      parameters:
      - description: Prompt data
        in: body
        name: prompt
        required: true
        schema:
          $ref: '#/definitions/domain.Prompt'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Prompt'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create or update prompt
      tags:
      - Prompts
swagger: "2.0"
